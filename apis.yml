name: Bezi
description: 'Bezi is an AI agent for Unity game developers that runs directly inside the Unity Editor.
  It indexes a project''s scripts, assets, scenes, packages and documentation in real time to deliver
  context-aware debugging, code generation, shader creation, scene building and no-code Unity tool
  automation that follows each project''s own conventions. Bezi supports multiple frontier models
  (Claude Sonnet, GPT, GLM and others), a Skills system for packaging repeatable workflows, MCP
  connections for external context (Blender, Miro, Notion, Perforce and more), and real-time
  collaborative team workspaces. The company is SOC 2 Type II certified and backed by Bessemer Venture
  Partners and Uncork Capital. Bezi ships an in-editor product and desktop/plugin experience rather
  than a public HTTP API.'
